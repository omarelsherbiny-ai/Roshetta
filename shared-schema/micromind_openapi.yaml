# shared-schema/micromind_openapi.yaml  (GENERATED by scripts/export_ai_openapi.py, do not edit)
openapi: "3.1.0"
info:
  title: "Roshetta AI read tools"
  description: "Read-only, tenant-scoped tools for the MicroMind assistant. No writes."
  version: "1.0.0"
servers:
  - url: "https://guiltless-inadequately-wilda.ngrok-free.dev/ai"
paths:
  "/items":
    get:
      operationId: "search_inventory"
      summary: "List or search this pharmacy's products. Leave search and category empty to list ALL products (alphabetical, up to limit 50, page with offset); or search by name, active ingredient or barcode, or filter by category"
      parameters:
        - name: "search"
          in: "query"
          required: false
          schema:
            description: "Optional. Leave empty to list all products."
            type: "string"
            maxLength: 100
          description: "Optional. Leave empty to list all products."
        - name: "category"
          in: "query"
          required: false
          schema:
            type: "string"
            maxLength: 100
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 50
            minimum: 1
            default: 20
        - name: "offset"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 1000
            minimum: 0
            description: "How many products to skip, to read the next page."
            default: 0
          description: "How many products to skip, to read the next page."
      responses:
        "200":
          description: "OK"
      security:
        - bearerAuth: []
  "/match":
    post:
      operationId: "match_product"
      summary: "Find one product by a typed or spoken name; when none matches exactly it returns the closest products (typos, missing or swapped letters) as suggestions for the user to choose from"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              properties:
                query_name:
                  type: "string"
                  maxLength: 100
                  minLength: 1
              type: "object"
              required:
                - "query_name"
      responses:
        "200":
          description: "OK"
      security:
        - bearerAuth: []
  "/entries":
    get:
      operationId: "list_ledger_entries"
      summary: "List recent sales, expenses and restocks (use day, or start_day with end_day)"
      parameters:
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 50
            minimum: 1
            default: 20
        - name: "offset"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 1000
            minimum: 0
            default: 0
        - name: "entry_type"
          in: "query"
          required: false
          schema:
            enum:
              - "log_sale"
              - "log_expense"
              - "log_restock"
            type: "string"
        - name: "day"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "start_day"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "end_day"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "OK"
      security:
        - bearerAuth: []
  "/payables":
    get:
      operationId: "list_supplier_payables"
      summary: "List credit restocks with what was paid and what is still owed, newest first"
      parameters:
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 50
            minimum: 1
            default: 20
        - name: "offset"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 1000
            minimum: 0
            default: 0
        - name: "status"
          in: "query"
          required: false
          schema:
            enum:
              - "unpaid"
              - "partly_paid"
              - "paid"
            type: "string"
        - name: "start_day"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "end_day"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "OK"
      security:
        - bearerAuth: []
  "/summary":
    get:
      operationId: "get_sales_summary"
      summary: "Sales and expenses totals for one day (day) or a range (start_day with end_day)"
      parameters:
        - name: "day"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "start_day"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "end_day"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "OK"
      security:
        - bearerAuth: []
  "/pharmacy-summary":
    get:
      operationId: "get_pharmacy_summary"
      summary: "One-call overview of the pharmacy for today (Cairo day): stock totals, low, out-of-stock and expiring product counts, today's sales and expenses, and what is owed to suppliers; parts this role may not see are listed in omitted"
      parameters:
        - name: "expiring_within_days"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 365
            minimum: 1
            default: 30
      responses:
        "200":
          description: "OK"
      security:
        - bearerAuth: []
  "/timeline":
    get:
      operationId: "list_records_timeline"
      summary: "Newest-first records: sales, expenses, restocks, product and category changes, staff and settings changes (only what this role may see)"
      parameters:
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 50
            minimum: 1
            default: 20
        - name: "offset"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 1000
            minimum: 0
            default: 0
        - name: "kind"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
            maxLength: 50
        - name: "start_day"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "end_day"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "OK"
      security:
        - bearerAuth: []
  "/propose-product":
    post:
      operationId: "propose_product"
      summary: "Prepare a card for the user to review, edit and confirm that adds a NEW product. Nothing is saved until the user confirms in the app."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              properties:
                name:
                  type: "string"
                  maxLength: 150
                  minLength: 1
                  description: "Product name exactly as the user gave it"
                unit_sell_price:
                  type: "number"
                  maximum: 100000000.0
                  exclusiveMinimum: 0.0
                  description: "Selling price in EGP"
                unit_buy_price:
                  description: "Buying price in EGP, only if the user gave it"
                  type: "number"
                  maximum: 100000000.0
                  minimum: 0.0
                stock_qty:
                  description: "Starting stock, only if the user gave it"
                  type: "number"
                  maximum: 1000000.0
                  minimum: 0.0
                min_threshold:
                  description: "Low-stock level, only if the user gave it"
                  type: "number"
                  maximum: 1000000.0
                  minimum: 1.0
                category:
                  type: "string"
                  maxLength: 50
                language:
                  type: "string"
                  enum:
                    - "ar"
                    - "en"
                  description: "Language of the user's question"
                  default: "ar"
              additionalProperties: false
              type: "object"
              required:
                - "name"
                - "unit_sell_price"
      responses:
        "200":
          description: "OK"
      security:
        - bearerAuth: []
  "/propose-product-update":
    post:
      operationId: "propose_product_update"
      summary: "Prepare a card for the user to review, edit and confirm that CHANGES an existing product's name, prices, low-stock level or category. Stock cannot be changed this way. Nothing is saved until the user confirms in the app."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              properties:
                item_id:
                  type: "integer"
                  minimum: 1.0
                  description: "Product id exactly as a search or match result returned it; never guess one"
                name_ar:
                  description: "New Arabic name, only if the user asked to change it"
                  type: "string"
                  maxLength: 150
                  minLength: 1
                name_en:
                  description: "New English name, only if the user asked to change it"
                  type: "string"
                  maxLength: 150
                  minLength: 1
                unit_sell_price:
                  description: "New selling price in EGP, only if the user asked to change it"
                  type: "number"
                  maximum: 100000000.0
                  exclusiveMinimum: 0.0
                unit_buy_price:
                  description: "New buying price in EGP, only if the user asked to change it"
                  type: "number"
                  maximum: 100000000.0
                  minimum: 0.0
                min_threshold:
                  description: "New low-stock level, only if the user asked to change it"
                  type: "number"
                  maximum: 1000000.0
                  minimum: 1.0
                category:
                  description: "New category, only if the user asked to change it"
                  type: "string"
                  maxLength: 40
                  minLength: 1
                language:
                  type: "string"
                  enum:
                    - "ar"
                    - "en"
                  description: "Language of the user's question"
                  default: "ar"
              additionalProperties: false
              type: "object"
              required:
                - "item_id"
      responses:
        "200":
          description: "OK"
      security:
        - bearerAuth: []
  "/propose-invite":
    post:
      operationId: "propose_invite"
      summary: "Prepare a card for the user to review, edit and confirm that creates an invitation link for a role. The link does not exist until the user confirms in the app and is never shown to you."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              properties:
                role_name:
                  type: "string"
                  maxLength: 60
                  minLength: 1
                  description: "Name of the role to invite, exactly as the user said it (a built-in role such as cashier, pharmacist or viewer, or a custom role's name)"
                expires_in_days:
                  type: "integer"
                  maximum: 30.0
                  minimum: 1.0
                  description: "Days the link stays valid; leave at 7 unless the user asked for another number"
                  default: 7
                max_uses:
                  type: "integer"
                  maximum: 50.0
                  minimum: 1.0
                  description: "How many people may use the link; leave at 1 unless the user asked for more"
                  default: 1
                language:
                  type: "string"
                  enum:
                    - "ar"
                    - "en"
                  description: "Language of the user's question"
                  default: "ar"
              additionalProperties: false
              type: "object"
              required:
                - "role_name"
      responses:
        "200":
          description: "OK"
      security:
        - bearerAuth: []
  "/propose-category":
    post:
      operationId: "propose_category"
      summary: "Prepare a card for the user to review, edit and confirm that creates a NEW product category. Nothing is saved until the user confirms in the app."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              properties:
                name:
                  type: "string"
                  maxLength: 40
                  minLength: 1
                  description: "Category name exactly as the user gave it"
                language:
                  type: "string"
                  enum:
                    - "ar"
                    - "en"
                  description: "Language of the user's question"
                  default: "ar"
              additionalProperties: false
              type: "object"
              required:
                - "name"
      responses:
        "200":
          description: "OK"
      security:
        - bearerAuth: []
  "/propose-restock":
    post:
      operationId: "propose_restock"
      summary: "Prepare a card for the user to review, edit and confirm that ADDS units to an existing product's stock. The buy price is taken from the product and the user can edit it on the card. Nothing is saved until the user confirms in the app."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              properties:
                item_id:
                  type: "integer"
                  minimum: 1.0
                  description: "Product id exactly as a search or match result returned it; never guess one"
                quantity:
                  type: "number"
                  maximum: 1000000.0
                  exclusiveMinimum: 0.0
                  description: "How many units to ADD to the stock (not the new total), as the user said it"
                language:
                  type: "string"
                  enum:
                    - "ar"
                    - "en"
                  description: "Language of the user's question"
                  default: "ar"
              additionalProperties: false
              type: "object"
              required:
                - "item_id"
                - "quantity"
      responses:
        "200":
          description: "OK"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
